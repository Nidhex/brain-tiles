<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tileGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1E293B" stroke-width="2"/>
  
  <!-- 2x2 Mini Tiles Motif -->
  <rect x="10" y="10" width="19" height="19" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="35" y="10" width="19" height="19" rx="5" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="10" y="35" width="19" height="19" rx="5" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <!-- Glowing Master Tile -->
  <rect x="35" y="35" width="19" height="19" rx="5" fill="url(#tileGlow)" filter="url(#glow)"/>
  
  <!-- Number representation -->
  <text x="44.5" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">2K</text>
  <text x="19.5" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">2</text>
  <text x="44.5" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">8</text>
  <text x="19.5" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">64</text>
</svg>
